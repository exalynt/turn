name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each check runs once per Go module: the core module, the nested adapter
# modules, and the end-to-end tests. Keep the module list in sync with MODULES
# in the Makefile.
jobs:
  go-build:
    name: Go build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", store/mongo, tests/e2e]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: go build ./...

  go-vet:
    name: Go vet (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", store/mongo, tests/e2e]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: go vet ./...

  go-test:
    name: Go test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", store/mongo, tests/e2e]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "**/go.sum"
      - run: go test ./...

  go-fmt:
    name: Go fmt (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", store/mongo, tests/e2e]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Check gofmt
        run: |
          go fmt ./...
          git diff --exit-code

  golangci-lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", store/mongo, tests/e2e]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9.0
          working-directory: ${{ matrix.module }}

  e2e-test:
    name: End-to-end tests
    # MongoDB 8 refuses to start on Linux 6.19 and newer, which ubuntu-latest
    # runs from Ubuntu 26.04 (https://jira.mongodb.org/browse/SERVER-121912).
    # Return to ubuntu-latest once the mongo:8 image supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/e2e/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Start the test databases
        run: |
          cp compose.override.example.yml compose.override.yml
          docker compose up -d --wait
      - name: Run end-to-end tests
        working-directory: tests/e2e
        run: go test -tags e2e ./...
      - name: Show the database logs
        if: failure()
        run: docker compose logs
